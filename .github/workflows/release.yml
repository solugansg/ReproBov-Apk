name: Publish Latest APK Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find APK File
        id: get_apk
        run: |
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found, skipping release"
            exit 0
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          VERSION=$(basename "$APK_FILE" .apk | sed -e 's/ReproBov[ _-]*//I')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete Previous Releases and Tags
        if: steps.get_apk.outputs.apk_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for previous releases..."
          RELEASES=$(gh release list --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $RELEASES; do
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create New Release with APK
        if: steps.get_apk.outputs.apk_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ steps.get_apk.outputs.version }}"
          TITLE="ReproBov ${{ steps.get_apk.outputs.version }}"
          gh release create "$TAG_NAME" "${{ steps.get_apk.outputs.apk_path }}" \
            --title "$TITLE" \
            --notes "### ReproBov Móvil — Distribución Oficial (Solugan SG)
**Versión:** ${{ steps.get_apk.outputs.version }}

#### 📲 Instrucciones de Instalación:
1. Haz clic en el enlace del archivo APK adjunto para descargarlo en tu celular Android.
2. Abre el archivo descargado.
3. Si Android solicita confirmación, pulsa **Permitir desde esta fuente**.
4. Pulsa **Instalar** (o **Actualizar**). Tus datos se conservan." \
            --latest
